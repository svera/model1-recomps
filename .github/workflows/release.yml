name: Package release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-15
            archive: build/mac/vr/VirtuaRacingRecomp-mac.zip
            swa_archive: build/mac/swa/StarWarsArcadeRecomp-mac.zip
            wingwar_archive: build/mac/wingwar/WingWarRecomp-mac.zip
          - platform: win
            runner: macos-15
            archive: build/win/vr/VirtuaRacingRecomp-windows.zip
            swa_archive: build/win/swa/StarWarsArcadeRecomp-windows.zip
            wingwar_archive: build/win/wingwar/WingWarRecomp-windows.zip
          - platform: linux
            runner: ubuntu-24.04
            archive: build/linux/vr/VirtuaRacingRecomp-linux.tar.gz
            swa_archive: build/linux/swa/StarWarsArcadeRecomp-linux.tar.gz
            wingwar_archive: build/linux/wingwar/WingWarRecomp-linux.tar.gz
    env:
      M1_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Install Windows cross-compiler
        if: matrix.platform == 'win'
        run: brew install mingw-w64

      - name: Build package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: tools/"$PLATFORM"/package.sh vr swa wingwar

      - name: Verify packages
        env:
          VR_ARCHIVE: ${{ matrix.archive }}
          SWA_ARCHIVE: ${{ matrix.swa_archive }}
          WINGWAR_ARCHIVE: ${{ matrix.wingwar_archive }}
        run: |
          test -s "$VR_ARCHIVE"
          test -s "$SWA_ARCHIVE"
          test -s "$WINGWAR_ARCHIVE"

      - name: Store package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.swa_archive }}
            ${{ matrix.wingwar_archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    name: Package Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build and sign APKs
        env:
          ANDROID_VERSION_NAME: ${{ github.event.release.tag_name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: sh tools/android/package.sh

      - name: Store APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build/android-release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  upload:
    name: Attach release assets
    needs: [build, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: packages

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            packages/vr/VirtuaRacingRecomp-mac.zip \
            packages/vr/VirtuaRacingRecomp-windows.zip \
            packages/vr/VirtuaRacingRecomp-linux.tar.gz \
            packages/swa/StarWarsArcadeRecomp-mac.zip \
            packages/swa/StarWarsArcadeRecomp-windows.zip \
            packages/swa/StarWarsArcadeRecomp-linux.tar.gz \
            packages/wingwar/WingWarRecomp-mac.zip \
            packages/wingwar/WingWarRecomp-windows.zip \
            packages/wingwar/WingWarRecomp-linux.tar.gz \
            packages/VirtuaRacingRecomp-android.apk \
            packages/StarWarsArcadeRecomp-android.apk \
            packages/WingWarRecomp-android.apk \
            --clobber
